    <script>
      FM.UI.boot();
    </script>
    <script>
      // Offline + installable: the service worker only runs on https or localhost — and never inside the
      // native app, which ships its files in the package (a cache there would outlive app updates)
      const nativeApp = !!(
        window.Capacitor &&
        window.Capacitor.isNativePlatform &&
        window.Capacitor.isNativePlatform()
      );
      if (
        !nativeApp &&
        'serviceWorker' in navigator &&
        (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))
      ) {
        window.addEventListener('load', () =>
          navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service worker not registered', e)),
        );
      }
    </script>
  </body>
